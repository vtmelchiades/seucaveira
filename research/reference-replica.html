<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Seu Caveira — banda-alvo (SPEC §2)</title>
<style>body{margin:0;background:#090909;color:#ece7de;font:14px sans-serif}
section{position:relative}
section::after{content:attr(id);position:absolute;top:8px;left:12px;letter-spacing:.2em;font-size:10px;text-transform:uppercase;color:#666}</style></head>
<body>
<main>
<section id="hero" class="band" style="height:110vh;background:#0a0a0a"></section>
<section id="reel" class="band" style="height:260vh;background:#141414"></section>
<section id="acervo" class="band" style="min-height:220vh;background:#101010"></section>
<section id="servicos" class="band" style="height:320vh;background:#141414"></section>
<section id="processo" class="band" style="min-height:180vh;background:#0c0c0c"></section>
<section id="estudio" class="band" style="min-height:110vh;background:#ece7de;color:#0a0a0a"></section>
<section id="clientes" class="band" style="height:34vh;background:#131313"></section>
<section id="contato" class="band" style="min-height:120vh;background:#0e0e0e"></section>
</main>
</body></html>
